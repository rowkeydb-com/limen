name: Sanitizers

# Bazel runs in the image rowkeydb-com/rowkeydb-build-infra publishes,
# named by digest below, on one of GitHub's machines. Where the
# repository's BuildBuddy secret reaches the run, as it reaches a push and
# a pull request from a branch of this repository, BuildBuddy runs the
# actions, which share its cache with the other repositories built on that
# infrastructure. GitHub gives no secret to a pull request from a fork,
# whose actions therefore run on GitHub's machine.

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CI_DOCKER_IMAGE: ghcr.io/rowkeydb-com/rowkeydb-build-infra@sha256:c811e74114ebedf787178468c9a796e4e37ae7e55f2d2fdc63501ea940c04515
  LIMEN_EXECUTION: ${{ secrets.BUILDBUDDY_API_KEY != '' && 'buildbuddy' || 'local' }}

jobs:
  sanitizers:
    name: ${{ matrix.config }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        config: [asan-ubsan, tsan, msan]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # No later step needs the token.
          persist-credentials: false

      - name: Execute Bazel test suite under ${{ matrix.config }} sanitizer
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: .github/scripts/run-bazel-in-docker.sh ${{ matrix.config }} test
