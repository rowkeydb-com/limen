name: Static Analysis

# A throwaway branch. planted/ holds Go code its BUILD file does not
# describe, and the Gazelle check must fail on it on BuildBuddy and
# without it.

on:
  push:
    branches: [gazelle-planted]

permissions:
  contents: read

env:
  CI_DOCKER_IMAGE: ghcr.io/rowkeydb-com/rowkeydb-build-infra@sha256:c811e74114ebedf787178468c9a796e4e37ae7e55f2d2fdc63501ea940c04515

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Gazelle check on BuildBuddy
        id: buildbuddy
        continue-on-error: true
        env:
          LIMEN_EXECUTION: buildbuddy
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: .github/scripts/run-bazel-in-docker.sh gazelle test

      - name: Gazelle check without BuildBuddy
        id: local
        continue-on-error: true
        env:
          LIMEN_EXECUTION: local
        run: .github/scripts/run-bazel-in-docker.sh gazelle test

      - name: Require both Gazelle checks to fail
        env:
          BUILDBUDDY_OUTCOME: ${{ steps.buildbuddy.outcome }}
          LOCAL_OUTCOME: ${{ steps.local.outcome }}
        run: |
          echo "Gazelle check on BuildBuddy: $BUILDBUDDY_OUTCOME; without it: $LOCAL_OUTCOME"
          [ "$BUILDBUDDY_OUTCOME" = failure ] && [ "$LOCAL_OUTCOME" = failure ]
